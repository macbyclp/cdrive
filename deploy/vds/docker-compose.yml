# Cdrive'ın kendisini (MySQL dahil) OnlyOffice'in çalıştığı VDS'te ikinci bir
# Docker uygulaması olarak barındırmak için. Aynı VDS'te ~/onlyoffice/ altında
# çalışan OnlyOffice Document Server'a DOKUNMAZ, ayrı bir stack'tir.
#
# Kurulum:
#   1. Bu dosyayı VDS'te bir klasöre kopyalayın (ör. ~/cdrive-deploy/docker-compose.yml).
#   2. Aynı klasöre Cdrive'ın kaynak kodunu klonlayın: `git clone https://github.com/macbyclp/cdrive.git app`
#      (build context'i "./app" — aşağıdaki `build.context` ile eşleşmeli.)
#   3. Aşağıdaki TÜM "replace-with-..." değerlerini gerçek değerlerle değiştirin
#      (MYSQL şifresi, SESSION_SECRET, ONLYOFFICE_JWT_SECRET — OnlyOffice'in
#      kendi docker-compose.yml'indeki JWT_SECRET ile AYNI olmalı).
#   4. `docker compose up -d --build` ile başlatın (ilk build birkaç dakika sürer).
#   5. Ana Caddy'ye (bkz. ../onlyoffice/ klasöründeki not) bir site daha ekleyin:
#      `cdrive.calapverdi.tr { reverse_proxy localhost:3001 }` ve `systemctl reload caddy`.

services:
  cdrive-db:
    image: mysql:8.4
    container_name: cdrive-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=replace-with-a-strong-password
      - MYSQL_DATABASE=cdrive
      - MYSQL_USER=cdrive
      - MYSQL_PASSWORD=replace-with-a-strong-password
    volumes:
      - cdrive_db_data:/var/lib/mysql
    # Kaynak limitleri: ortamda CDRIVE_DB_MEM_LIMIT ile ezilebilir (varsayılanlar makul bir başlangıçtır; sunucunuza göre ayarlayın).
    mem_limit: ${CDRIVE_DB_MEM_LIMIT:-1g}
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-preplace-with-a-strong-password"]
      interval: 5s
      timeout: 5s
      retries: 20

  cdrive:
    # Sabit imaj adı: updater güncellemeden önce bunu "cdrive-app:rollback" olarak etiketler,
    # yeni sürüm sağlıklı açılmazsa eskisine geri döner.
    image: cdrive-app:local
    build:
      context: ./app
      # basePath derleme zamanında sabitlenir (subdomain kullanıyoruz, alt-yol
      # değil, bu yüzden boş) — sadece `environment:` altına yazmak yetmez.
      args:
        NEXT_BASE_PATH: ""
        # Uzaktan güncelleme: updater bu ikisini ortam değişkeniyle verir (elle `up --build`
        # yaparsanız "unknown" kalır; sürüm kartı commit'i göstermez, güncelleme yine çalışır).
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-}
    container_name: cdrive-app
    restart: unless-stopped
    depends_on:
      cdrive-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql://cdrive:replace-with-a-strong-password@cdrive-db:3306/cdrive
      - SESSION_SECRET=replace-with-a-long-random-string
      - NEXT_BASE_PATH=
      - APP_URL=https://cdrive.calapverdi.tr
      - ONLYOFFICE_URL=https://office.calapverdi.tr
      - ONLYOFFICE_JWT_SECRET=replace-with-the-same-value-as-onlyoffice-compose
      - STORAGE_ROOT=/app/storage
      - PORT=3000
      # Uzaktan güncelleme (Yönetim → Güncelleme). UPDATER_TOKEN, aşağıdaki cdrive-updater ile AYNI olmalı.
      - UPDATER_URL=http://cdrive-updater:9000
      - UPDATER_TOKEN=replace-with-openssl-rand-hex-32
      - UPDATE_REPO=macbyclp/cdrive
      - UPDATE_BRANCH=main
      # Claude yardımcısı (kenar çubuğundaki Claude düğmesi). CLAUDE_TOKEN, aşağıdaki cdrive-claude ile AYNI olmalı.
      - CLAUDE_URL=http://cdrive-claude:9100
      - CLAUDE_TOKEN=replace-with-openssl-rand-hex-32
    networks:
      - default
      - claude_net
    volumes:
      - cdrive_storage:/app/storage
    mem_limit: ${CDRIVE_MEM_LIMIT:-1g}
    cpus: ${CDRIVE_CPUS:-1.5}
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    ports:
      # Yalnız loopback: dışarıya TLS'li ters vekil (Caddy/nginx) açar; 3001 doğrudan yayınlanmamalı.
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Uzaktan güncelleme sidecar'ı — admin panelindeki "Şimdi güncelle" düğmesi bunu tetikler.
  # UYARI: docker soketi bağlı olduğu için bu servis sunucuda root eşdeğeri yetkiye sahiptir.
  # Bu yüzden port YAYINLANMAZ (yalnız compose ağından erişilir) ve Bearer belirteci şarttır.
  cdrive-updater:
    build:
      context: ./app/deploy/vds/updater
    container_name: cdrive-updater
    restart: unless-stopped
    depends_on:
      - cdrive
    environment:
      - UPDATER_TOKEN=replace-with-openssl-rand-hex-32
      - UPDATE_BRANCH=main
      - APP_SERVICE=cdrive
      - APP_CONTAINER=cdrive-app
      - DB_CONTAINER=cdrive-mysql
      - DB_NAME=cdrive
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Compose klasörü (docker-compose.yml + app/ klonu) konteynerde /deploy olarak görünür.
      - .:/deploy
      - ./backups:/backups
      - cdrive_updater_state:/state
    mem_limit: 256m
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  # Claude yardımcısı: Claude CLI'ı Cdrive araçlarıyla çalıştıran sidecar. Veritabanına/diske/docker'a erişimi YOK:
  # yalnızca claude_net üzerinden Cdrive API'sine ve (NAT ile) Anthropic'e ulaşır. İlk kurulumda giriş yapılır:
  #   docker exec -it cdrive-claude claude login        (ayrıntı: deploy/vds/claude/README.md)
  cdrive-claude:
    build:
      context: ./app/deploy/vds/claude
    container_name: cdrive-claude
    restart: unless-stopped
    depends_on:
      - cdrive
    environment:
      - CLAUDE_TOKEN=replace-with-openssl-rand-hex-32
      - CDRIVE_URL=http://cdrive:3000
      # - CLAUDE_MODEL=claude-sonnet-5-5   # isteğe bağlı; boşsa CLI varsayılanı
      # - ANTHROPIC_API_KEY=               # abonelik girişi yerine API anahtarı kullanmak isterseniz
    networks:
      - claude_net
    volumes:
      - cdrive_claude_home:/home/claude
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

networks:
  claude_net: {}

volumes:
  cdrive_db_data:
  cdrive_storage:
  cdrive_updater_state:
  cdrive_claude_home:
