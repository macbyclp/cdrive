# OnlyOffice Document Server — Word/Excel/PowerPoint düzenleme için Cdrive'ın
# bağlandığı ayrı servis. Bu dosyayı Cdrive'ın KENDİSİNİ çalıştırmayan, Docker
# destekleyen bir VPS'e kopyalayıp orada çalıştırın (cPanel paylaşımlı hosting
# genelde Docker desteklemez — bkz. ana README).
#
# Kurulum:
#   1. Aşağıdaki JWT_SECRET değerini rastgele/uzun bir değerle değiştirin
#      (ör. `openssl rand -hex 32`) ve Cdrive'ın .env dosyasındaki
#      ONLYOFFICE_JWT_SECRET ile AYNI değeri kullanın.
#   2. `docker compose up -d` ile başlatın.
#   3. Önünde bir ters proxy (nginx/Caddy) ile HTTPS + bir alan adı verin —
#      Document Server'a http üzerinden çıplak erişim güvensizdir. Caddy
#      kullanıyorsanız tek satır yeter: `office.alan-adiniz.com { reverse_proxy localhost:8080 }`
#   4. Cdrive'ın .env dosyasında ONLYOFFICE_URL'i bu alan adına ayarlayın.
#
# Not: Document Server'ın Cdrive'a (APP_URL) ve Cdrive'ın Document Server'a
# (ONLYOFFICE_URL) HTTPS üzerinden karşılıklı ulaşabilmesi gerekir — ikisi de
# herkese açık, geçerli TLS sertifikalı adresler olmalı (self-signed olmaz).

services:
  onlyoffice-document-server:
    image: onlyoffice/documentserver:8
    container_name: cdrive-onlyoffice
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=replace-with-a-long-random-string
      - JWT_HEADER=Authorization
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice

volumes:
  onlyoffice_data:
  onlyoffice_logs:
